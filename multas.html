<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Multas</title>
</head>
<body>

    <h1>Sistema de Multas</h1>

    <label for="velocidade">Velocidade do carro:</label> 
    <input type="number" name="velocidade" id="velocidade" value="100"> km/h 
    <button onclick="verificar()">verificar</button>

    <p id="mensagemVelocidade"></p>
    <p id="resultado"></p>

    <script>
      const LIMITE = 80;

      function verificar() {
        const campo = document.getElementById("velocidade");
        const velocidade = Number(campo.value);

        const mensagemVelocidade = document.getElementById("mensagemVelocidade");
        const resultado = document.getElementById("resultado");

        mensagemVelocidade.innerHTML =
          "Sua velocidade atual é de <b>" + velocidade + "</b> km/h.";

        if (velocidade > LIMITE) {
          resultado.innerHTML = "Velocidade acima do permitido! MULTADO.";
        } else {
          resultado.innerHTML = "Velocidade dentro do limite. Tudo certo!";
        }
      }
    </script>

</body>
</html>
