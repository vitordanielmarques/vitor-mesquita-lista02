<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo Claro/Escuro</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      background-color: white;
      color: black;
    }
 
    /*Classe aplicada no body quando o tema escuro está ativo */
    body.escuro {
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Modo Claro/Escuro</h1>
 
  <button onclick="mudarTema()">Mudar Tema</button>
 
  <script>
    function mudarTema() {
      // Liga a classe "escuro" se não estiver no body, e desliga se estiver
      document.body.classList.toggle("escuro");
    }
  </script>
</body>
</html>
