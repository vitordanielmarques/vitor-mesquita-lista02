<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destacar</title>
</head>
<body>
  <p>Escreva um nome e veja ele destacado na lista</p>
  <p>Se o nome não estiver na lista, ou não for exatamente igual, ele não será destacado</p>
 
  <input type="text" id="nome" oninput="mostrarLista()">
 
  <ol id="lista"></ol>
 
  <script>
    const nomes = ["João", "Márcio", "Fabiana", "Jorge", "Silvana", "Luiz", "Sandra"];
 
    function mostrarLista() {
      const digitado = document.getElementById("nome").value;
      const lista = document.getElementById("lista");
 
      // Limpa a lista antes de montar de novo
      lista.innerHTML = "";
 
      // Laço: cria um <li> para cada nome e adiciona na lista
      for (let i = 0; i < nomes.length; i++) {
        const item = document.createElement("li");
 
        // Só destaca se o nome for exatamente igual ao digitado
        if (nomes[i] === digitado) {
          const destaque = document.createElement("span");
          destaque.textContent = nomes[i];
          destaque.style.color = "red";
          destaque.style.fontWeight = "bold";
          item.appendChild(destaque);
        } else {
          item.textContent = nomes[i];
        }
 
        lista.appendChild(item);
      }
    }
 
    // Mostra a lista assim que a página abre
    mostrarLista();
  </script>
</body>
</html>
