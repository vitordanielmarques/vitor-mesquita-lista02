<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presença</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
    }
 
    button {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
    }
 
    .linha {
      font-weight: bold;
    }
 
    .presente { color: green; }
    .ausente  { color: red; }
  </style>
</head>
<body>
  <div id="chamada"></div>
 
  <p><button onclick="confirmar()">Confirmar Presença</button></p>
 
  <div id="resultado"></div>
 
  <script>
    const nomes = ["João", "Márcio", "Fabiana", "Jorge", "Silvana", "Luiz", "Carlos", "Pablo"];
 
    // Cria um checkbox com nome para cada pessoa e adiciona na página
    const chamada = document.getElementById("chamada");
    for (let i = 0; i < nomes.length; i++) {
      const linha = document.createElement("div");
 
      const caixa = document.createElement("input");
      caixa.type = "checkbox";
      caixa.id = "aluno" + i;
 
      const rotulo = document.createElement("label");
      rotulo.htmlFor = caixa.id;
      rotulo.textContent = " " + nomes[i];
 
      linha.appendChild(caixa);
      linha.appendChild(rotulo);
      chamada.appendChild(linha);
    }
 
    // Monta uma linha como "Presentes: João, Márcio" com os nomes coloridos
    function montarLinha(titulo, lista, classe) {
      const linha = document.createElement("div");
      linha.className = "linha";
      linha.appendChild(document.createTextNode(titulo + ": "));
 
      if (lista.length === 0) {
        linha.appendChild(document.createTextNode("ninguém"));
      }
 
      for (let i = 0; i < lista.length; i++) {
        const nome = document.createElement("span");
        nome.className = classe;
        nome.textContent = lista[i];
        linha.appendChild(nome);
 
        // Vírgula entre os nomes (não coloca depois do último)
        if (i < lista.length - 1) {
          linha.appendChild(document.createTextNode(", "));
        }
      }
      return linha;
    }
 
    function confirmar() {
      const presentes = [];
      const ausentes = [];
 
      // Separa quem está marcado de quem não está
      for (let i = 0; i < nomes.length; i++) {
        if (document.getElementById("aluno" + i).checked) {
          presentes.push(nomes[i]);
        } else {
          ausentes.push(nomes[i]);
        }
      }
 
      const resultado = document.getElementById("resultado");
      resultado.innerHTML = ""; // limpa o resultado anterior
 
      const titulo = document.createElement("h3");
      titulo.textContent = "Resultado";
      resultado.appendChild(titulo);
 
      resultado.appendChild(montarLinha("Presentes", presentes, "presente"));
      resultado.appendChild(montarLinha("Ausentes", ausentes, "ausente"));
    }
  </script>
</body>
</html>
